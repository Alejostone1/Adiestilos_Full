name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      # Prisma exige que la variable exista para leer/validar el schema,
      # aunque estos comandos (validate/format/generate) no se conectan a ninguna BD.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Validar esquema Prisma
        run: npx prisma validate
      - name: Comprobar formato del esquema
        run: npx prisma format --check
      - name: Generar cliente Prisma
        run: npx prisma generate

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar imports (case-sensitive en rutas)
        run: node ../scripts/check-imports-case.js
      - name: Compilar producción
        run: npm run build